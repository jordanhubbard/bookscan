[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookscan"
version = "0.1.0"
description = "A Qt camera workspace for scanning and organizing books"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
bookscan = "bookscan.app:main"

[tool.setuptools.packages.find]
include = ["bookscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
